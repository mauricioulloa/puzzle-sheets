[package]
name = "puzzle-sheets"
version = "0.1.0"
edition = "2024"
authors = ["Mauri Ulloa <https://mauriulloa.com>"]
description = "Printable puzzle worksheets for students and educators, over HTTP and MCP"
license = "MIT"
repository = "https://github.com/mauricioulloa/puzzle-sheets"
homepage = "https://puzzles.mauriulloa.com"
readme = "README.md"
keywords = ["chess", "puzzles", "worksheets", "education", "mcp"]
categories = ["games", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "3.4.0", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["compression-gzip", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
