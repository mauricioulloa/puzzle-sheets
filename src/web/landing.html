<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__LEDE__">
<meta name="author" content="Mauri Ulloa">
<style>
  /* Same tokens as chess-puzzle-api's page, so the two read as one family. */
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --fg: #1a1a1a; --muted: #5c5c5c; --line: #e3e0da;
    --panel: #ffffff; --accent: #3c6e47;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e6e3; --muted: #9a9894; --line: #2c2e33;
      --panel: #1c1e22; --accent: #8fc79a;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); margin: 0;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  a { color: var(--accent); }
  h1 { font-size: 1.7rem; margin: 0 0 .3rem; letter-spacing: -.02em; }
  .lede { color: var(--muted); margin: 0 0 1.8rem; }
  .lang { float: right; font-size: .9rem; }

  fieldset { border: 0; padding: 0; margin: 0 0 1rem; }
  .field label {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  }

  .controls { display: flex; gap: .75rem; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: .3rem; flex: 1 1 11rem; }
  select, input[type=text], button {
    font: inherit; padding: .55rem .7rem; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  @media (prefers-color-scheme: dark) { button.primary { color: #12140f; } }

  .notes { margin-top: 2.5rem; color: var(--muted); font-size: .9rem; }
  footer { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line);
           color: var(--muted); font-size: .85rem; }
  footer p { margin: .4rem 0; }
  footer .by { color: var(--fg); }
</style>
</head>
<body>
<main>
  <a class="lang" href="__OTHER_LANG_URL__">__OTHER_LANG_LABEL__</a>
  <h1>__TITLE__</h1>
  <p class="lede">__LEDE__</p>

  <form action="/sheet/new" method="get">
    <input type="hidden" name="lang" value="__LANG__">
    <fieldset class="controls">
      <div class="field">
        <label for="level">__DIFFICULTY__</label>
        <select id="level" name="level">
__LEVELS__
        </select>
      </div>
      <div class="field">
        <label for="theme">__THEME__</label>
        <select id="theme" name="theme">
          <option value="">__ANY_THEME__</option>
__THEMES__
        </select>
      </div>
    </fieldset>

    <fieldset class="controls">
      <div class="field">
        <label for="count">__COUNT__</label>
        <select id="count" name="count">
          <option value="6">6</option>
          <option value="12">12</option>
        </select>
      </div>
      <div class="field">
        <label for="answers">__ANSWERS__</label>
        <select id="answers" name="answers">
          <option value="page">__ANSWERS_PAGE__</option>
          <option value="none">__ANSWERS_NONE__</option>
        </select>
      </div>
      <div class="field">
        <label for="title">__SHEET_TITLE__</label>
        <input id="title" type="text" name="title" maxlength="80" placeholder="__SHEET_TITLE_HINT__">
      </div>
    </fieldset>

    <button class="primary" type="submit">__CREATE__</button>
  </form>

  <div class="notes">
    <p>__NOTE_LICENCE__</p>
    <p>__NOTE_AGENTS__</p>
    <p>__NOTE_FEEDBACK__</p>
  </div>

  <footer>
    <p class="by">__FOOTER_BY__</p>
    <p>__FOOTER_DATA__</p>
    <p>__FOOTER_PIECES__</p>
  </footer>
</main>
</body>
</html>
